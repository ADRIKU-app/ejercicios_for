<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tablas de multiplicar</title>
    <link rel="stylesheet" href="multiplicar.css">
</head>
<body>

    <main class="contenedor">

        <section class="panel-practica" aria-labelledby="titulo-principal">
            <h1 id="titulo-principal">Practica las tablas</h1>

            <p class="instruccion">
                Escribe el número de la tabla que quieres practicar y luego presiona
                <strong>PROBAR</strong>.
            </p>

            <div class="grupo-entrada">
                <label for="numero-tabla" class="etiqueta-entrada">
                    ¿Qué tabla quieres practicar? ✏️
                </label>

                <input
                    type="text"
                    id="numero-tabla"
                    class="caja-texto"
                    placeholder="Ejemplo: 8"
                    inputmode="numeric"
                    autocomplete="off"
                    aria-describedby="ayuda-entrada"
                >

                <p id="ayuda-entrada" class="texto-ayuda">
                    Puedes escribir cualquier número, por ejemplo 3, 5 u 8.
                </p>
            </div>

            <button type="button" class="boton" id="probar" onclick="generarTablas()">
                PROBAR
            </button>

            <p id="mensaje" class="mensaje-ayuda" aria-live="polite"></p>
        </section>

        <section id="resultado-tabla" class="resultado-tabla" aria-live="polite">
            <div class="estado-inicial">
                <span class="estado-icono">🔢</span>
                <p>Tu tabla aparecerá aquí.</p>
            </div>
        </section>

    </main>

    <footer class="pie-pagina">
        <p>Creado por: <span>ADR1KU</span></p>
    </footer>

    <script src="multiplicar.js"></script>
</body>
</html>
