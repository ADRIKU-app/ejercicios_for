<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabla del 3</title>
    <link rel="stylesheet" href="multiplicar.css">
</head>
<body>

    <main class="contenedor" id="contenedor">

        <div class="grupo-entrada">
            <label for="numero-tabla" class="etiqueta-entrada">
                ¿Qué tabla quieres practicar? ✏️
            </label>

            <input
                type="text"
                id="numero-tabla"
                class="caja-texto"
                placeholder="Escribe un número"
                autocomplete="off"
            >
        </div>

        <a href="#tabla" class="boton" id="probar" onclick="generarTablas()">PROBAR</a>

        <section id="tabla" class="tarjeta">

            <h1>Tabla del 3</h1>

            <div class="tabla-div">

                <!-- Encabezado -->
                <div class="fila encabezado">
                    <div class="celda">Operación</div>
                    <div class="celda">Resultado</div>
                </div>

                <!-- Contenido -->
                <div class="tabla">
                    <div class="fila">3 × 1 = 3</div>
                    <div class="fila">3 × 2 = 6</div>
                    <div class="fila">3 × 3 = 9</div>
                    <div class="fila">3 × 4 = 12</div>
                    <div class="fila">3 × 5 = 15</div>
                    <div class="fila">3 × 6 = 18</div>
                    <div class="fila">3 × 7 = 21</div>
                    <div class="fila">3 × 8 = 24</div>
                    <div class="fila">3 × 9 = 27</div>
                    <div class="fila">3 × 10 = 30</div>
                </div>

            </div>

        </section>

    </main>

    <footer class="pie-pagina">
        <p>Creado por: <span>ADR1KU</span></p>
    </footer>

    <script src="multiplicar.js"></script>
</body>
</html>
